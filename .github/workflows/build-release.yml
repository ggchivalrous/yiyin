name: Build Release (on version tag)

# auto-release 工具在本地完成 version bump + commit + tag + push 后，
# 此处的 tag push 触发自动构建双平台安装包，并上传到对应的 GitHub Release。
# 产物同时作为 Artifact 上传（90 天），便于在 Actions 页面直接下载
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 当前是 arm64 runner；如需 x64 用 macos-13
        os: [macos-latest, windows-latest]

    steps:
      - name: 检出代码（带 tag，确保 version 正确）
        uses: actions/checkout@v4
        with:
          # 检出整个历史和 tag，auto-release 的 version bump commit 才在
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: yarn

      - name: 构建安装包
        run: yarn make
        env:
          # macOS 无签名身份时跳过签名（identity: null 已在 package.json 配置）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron 下载走镜像，避免网络问题
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 上传产物为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yiyin-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.zip
          if-no-files-found: warn
          retention-days: 90

  release:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码（取版本号 + 读取 tag 已有的 release notes）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取 tag 名（tag 触发用实际 tag；手动 dispatch 时 GITHUB_REF_NAME 是分支名，改用 package.json 版本）
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            ver="v$(node -p 'require("./package.json").version')"
            echo "tag=$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 列出产物
        run: find assets -type f -exec ls -lh {} \;

      - name: 发布到 Release（用触发 workflow 的 tag）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # tag 已存在时此字段被忽略；手动触发且 tag 尚不存在时，确保 tag
          # 打在实际构建的 commit 上，而不是默认分支 HEAD
          target_commitish: ${{ github.sha }}
          name: 壹印 ${{ steps.ver.outputs.tag }}
          body: |
            自动构建版本 ${{ steps.ver.outputs.tag }}

            触发自 tag: ${{ steps.ver.outputs.tag }} (commit ${{ github.sha }})

            **安装说明：**
            - macOS：下载 `.dmg`，首次打开需右键选择"打开"绕过 Gatekeeper（未签名）
            - Windows：`.exe`（NSIS 安装程序）或 `.msi`（MSI 安装包）
          files: assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
